name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Install xcpretty
        run: gem install xcpretty
      
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Build for testing
        run: |
          xcodebuild clean build-for-testing \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: Run tests
        run: |
          xcodebuild test-without-building \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: DerivedData/Logs/Test/*.xcresult

  build-archive:
    name: Build Release Archive
    runs-on: macos-14
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -configuration Release \
            -archivePath build/FinanceTracker.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: FinanceTracker-archive
          path: build/FinanceTracker.xcarchive
          retention-days: 30
