name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Debug - list repo contents
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "===== TOP LEVEL ====="
          ls -la
          echo "===== ALL FILES (git tracked) ====="
          git ls-files | head -100
          echo "===== XCODEPROJ / XCWORKSPACE ====="
          find . -maxdepth 5 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -not -path "*/xcuserdata/*" 2>/dev/null || true

      # ⚠️ CHANGE THIS PATH to match what the debug step shows
      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project FinanceTracker.xcodeproj \
            -scheme FinanceTracker \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry FinanceTracker-unsigned.ipa Payload
          ls -lh FinanceTracker-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FinanceTracker-unsigned-ipa
          path: ${{ runner.temp }}/FinanceTracker-unsigned.ipa
          retention-days: 30
